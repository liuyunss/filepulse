name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: FilePulse-linux-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: FilePulse-macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: FilePulse-windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            ./src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: |
            ./src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: |
            ./src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            ./src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.nsi

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Query version number
        run: echo "version=${GITHUB_REF:11}" >> $GITHUB_ENV

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-linux
          path: artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-macos
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-windows
          path: artifacts/windows

      - name: Rename artifacts
        run: |
          # Rename Linux
          if ls artifacts/linux/*.deb 2>/dev/null; then
            mv artifacts/linux/*.deb "FilePulse_${{ env.version }}_linux_x64.deb"
          fi
          # Rename macOS
          if ls artifacts/macos/*.dmg 2>/dev/null; then
            mv artifacts/macos/*.dmg "FilePulse_${{ env.version }}_macos_aarch64.dmg"
          fi
          # Rename Windows
          if ls artifacts/windows/*.exe 2>/dev/null; then
            mv artifacts/windows/*.exe "FilePulse_${{ env.version }}_windows_x64.exe"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.version }}
          name: FilePulse v${{ env.version }}
          body: |
            ## FilePulse v${{ env.version }}
            
            跨平台文件分析筛选工具。
            
            ### 下载
            - **Windows**: FilePulse_${{ env.version }}_windows_x64.exe (绿色版，双击运行)
            - **macOS**: FilePulse_${{ env.version }}_macos_aarch64.dmg
            - **Linux**: FilePulse_${{ env.version }}_linux_x64.deb
          draft: false
          prerelease: false
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
