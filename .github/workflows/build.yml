name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: FilePulse-linux
          - os: macos-latest
            platform: macos
            artifact_name: FilePulse-macos
          - os: windows-latest
            platform: windows
            artifact_name: FilePulse-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # Linux 桌面构建需要 GTK3 和 Ninja
      - name: Install Linux desktop deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      # ─── Linux Build ─────────────────────────────────────
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Package Linux (tar.gz)
        if: matrix.platform == 'linux'
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../FilePulse-linux-x64.tar.gz .

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            build/linux/x64/release/bundle/
            build/linux/x64/release/FilePulse-linux-x64.tar.gz

      # ─── macOS Build ─────────────────────────────────────
      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release --no-codesign

      - name: Package macOS (zip)
        if: matrix.platform == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../FilePulse-macos.zip FilePulse.app

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: |
            build/macos/Build/Products/Release/FilePulse.app/
            build/macos/FilePulse-macos.zip

      # ─── Windows Build ───────────────────────────────────
      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Package Windows (zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows\x64\release
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "build\windows\x64\release\FilePulse-windows-x64.zip"

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: |
            build/windows/x64/runner/Release/
            build/windows/x64/release/FilePulse-windows-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query version number
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-linux
          path: artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-macos
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-windows
          path: artifacts/windows

      - name: Rename artifacts
        run: |
          # Linux
          if [ -f artifacts/linux/FilePulse-linux-x64.tar.gz ]; then
            mv artifacts/linux/FilePulse-linux-x64.tar.gz \
              "FilePulse_${{ env.version }}_linux_x64.tar.gz"
          fi
          # macOS
          if [ -f artifacts/macos/FilePulse-macos.zip ]; then
            mv artifacts/macos/FilePulse-macos.zip \
              "FilePulse_${{ env.version }}_macos.zip"
          fi
          # Windows
          if [ -f artifacts/windows/FilePulse-windows-x64.zip ]; then
            mv artifacts/windows/FilePulse-windows-x64.zip \
              "FilePulse_${{ env.version }}_windows_x64.zip"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.version }}
          name: FilePulse v${{ env.version }}
          body: |
            ## FilePulse v${{ env.version }}

            跨平台文件分析筛选工具。

            ### 下载
            - **Windows**: `FilePulse_${{ env.version }}_windows_x64.zip` (解压后运行)
            - **macOS**: `FilePulse_${{ env.version }}_macos.zip` (解压后运行 `FilePulse.app`)
            - **Linux**: `FilePulse_${{ env.version }}_linux_x64.tar.gz` (解压后运行)
          draft: false
          prerelease: false
          files: |
            FilePulse_${{ env.version }}_linux_x64.tar.gz
            FilePulse_${{ env.version }}_macos.zip
            FilePulse_${{ env.version }}_windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
