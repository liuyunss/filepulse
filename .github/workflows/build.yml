# .github/workflows/build.yml
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: FilePulse-linux-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: FilePulse-macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: FilePulse-windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            dpkg fakeroot libarchive-tools rpm

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend deps
        run: npm install

      - name: Build
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Find bundle files
        if: always()
        shell: bash
        run: |
          echo "=== Looking for bundle files ==="
          find src-tauri/target -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app" -o -name "*.exe" -o -name "*.msi" 2>/dev/null | head -20
          echo "=== Bundle directory (target path) ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/ 2>/dev/null || echo "No bundle dir"
          echo "=== Bundle directory (release path) ==="
          ls -la src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle dir"
          echo "=== All .exe files ==="
          find src-tauri/target -name "*.exe" 2>/dev/null | head -10

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f | head -30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
