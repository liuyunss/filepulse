<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilePulse — 文件筛选工具</title>
<style>
/* ===== Reset & Base ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5;
  color: #333;
  font-size: 14px;
  line-height: 1.6;
}

/* ===== Layout ===== */
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

/* ===== Top: Folder Selection ===== */
.folder-section {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  padding: 20px;
  margin-bottom: 16px;
}
.folder-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #555; }

.drop-zone {
  border: 2px dashed #c0c4cc;
  border-radius: 6px;
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  color: #888;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: #4a7cf7;
  background: #f0f5ff;
}
.drop-zone .icon { font-size: 28px; margin-bottom: 6px; }
.drop-zone p { font-size: 13px; }
.folder-path {
  margin-top: 10px;
  padding: 8px 12px;
  background: #f5f6f8;
  border-radius: 4px;
  font-size: 13px;
  color: #666;
  word-break: break-all;
  display: none;
}
.folder-path.show { display: block; }

/* ===== Middle: Filter Panel ===== */
.filter-section {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  padding: 16px 20px;
  margin-bottom: 16px;
}
.filter-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #555; }

.filter-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.filter-row:last-child { margin-bottom: 0; }
.filter-row input[type="checkbox"] {
  width: 16px; height: 16px; cursor: pointer; accent-color: #4a7cf7;
}
.filter-row label { font-size: 13px; color: #444; cursor: pointer; user-select: none; }
.filter-row input[type="number"],
.filter-row input[type="text"] {
  width: 100px;
  padding: 4px 8px;
  border: 1px solid #d0d0d0;
  border-radius: 4px;
  font-size: 13px;
  outline: none;
}
.filter-row input[type="number"]:focus,
.filter-row input[type="text"]:focus {
  border-color: #4a7cf7;
}
.filter-row .reverse-cb {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; color: #888;
}
.filter-row .reverse-cb input { width: 14px; height: 14px; accent-color: #f08080; }
.filter-row .input-group {
  display: flex; align-items: center; gap: 4px;
}
.filter-row .input-group span { font-size: 12px; color: #888; }

/* ===== Action Buttons ===== */
.action-bar {
  display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
}
.action-bar button {
  padding: 7px 16px;
  border: none;
  border-radius: 5px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}
.action-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-scan { background: #4a7cf7; color: #fff; }
.btn-scan:hover:not(:disabled) { background: #3a6ae0; }
.btn-danger { background: #f05050; color: #fff; }
.btn-danger:hover:not(:disabled) { background: #d83e3e; }
.btn-action { background: #e8eaef; color: #444; }
.btn-action:hover:not(:disabled) { background: #d8dce4; }

/* ===== File Table ===== */
.table-section {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  overflow: hidden;
}
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead th {
  background: #f5f7fa;
  padding: 9px 12px;
  text-align: left;
  font-weight: 600;
  color: #555;
  border-bottom: 1px solid #e0e0e0;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  position: relative;
}
thead th:hover { background: #eef1f7; }
thead th .sort-arrow { font-size: 11px; margin-left: 4px; color: #4a7cf7; }
tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid #f0f0f0;
  color: #444;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
tbody tr:hover { background: #f9fafb; }
tbody tr.selected { background: #eef3ff; }
tbody td:first-child { text-align: center; }
.file-name { font-weight: 500; color: #333; }
.file-size { color: #666; }
.file-type { color: #888; }
.file-date { color: #888; white-space: nowrap; }
.file-path { color: #999; font-size: 12px; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #aaa;
  font-size: 13px;
}

.totals-bar {
  padding: 8px 12px;
  font-size: 12px;
  color: #888;
  background: #fafbfc;
  border-top: 1px solid #f0f0f0;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #333;
  color: #fff;
  padding: 8px 20px;
  border-radius: 6px;
  font-size: 13px;
  opacity: 0;
  transition: transform 0.3s, opacity 0.3s;
  z-index: 999;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Confirm Modal ===== */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal-mask.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 8px; padding: 24px;
  width: 360px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
}
.modal-box h4 { font-size: 15px; margin-bottom: 10px; }
.modal-box p { font-size: 13px; color: #666; margin-bottom: 18px; line-height: 1.5; }
.modal-box .btns { display: flex; gap: 8px; justify-content: flex-end; }
.modal-box button {
  padding: 6px 16px; border-radius: 5px; border: none;
  font-size: 13px; cursor: pointer; font-weight: 500;
}
.modal-box .btn-confirm { background: #f05050; color: #fff; }
.modal-box .btn-cancel { background: #e8eaef; color: #444; }
</style>
</head>
<body>

<div class="container">
  <!-- ===== Folder Selection ===== -->
  <div class="folder-section">
    <h3>📂 选择文件夹</h3>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('folderInput').click()">
      <div class="icon">📁</div>
      <p>拖入文件夹到这里，或点击选择</p>
    </div>
    <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none">
    <div class="folder-path" id="folderPath"></div>
  </div>

  <!-- ===== Filter Panel ===== -->
  <div class="filter-section">
    <h3>🔍 筛选条件（勾选生效）</h3>

    <!-- 大于 -->
    <div class="filter-row">
      <input type="checkbox" id="f_sizeGt" data-filter="sizeGt">
      <label for="f_sizeGt">大于</label>
      <div class="input-group">
        <input type="number" id="f_sizeGtVal" value="100" min="0">
        <span>MB</span>
      </div>
      <label class="reverse-cb"><input type="checkbox" data-reverse="f_sizeGt">取反</label>
    </div>

    <!-- 小于 -->
    <div class="filter-row">
      <input type="checkbox" id="f_sizeLt" data-filter="sizeLt">
      <label for="f_sizeLt">小于</label>
      <div class="input-group">
        <input type="number" id="f_sizeLtVal" value="10" min="0">
        <span>MB</span>
      </div>
      <label class="reverse-cb"><input type="checkbox" data-reverse="f_sizeLt">取反</label>
    </div>

    <!-- 后缀等于 -->
    <div class="filter-row">
      <input type="checkbox" id="f_extEq" data-filter="extEq">
      <label for="f_extEq">后缀等于</label>
      <input type="text" id="f_extEqVal" placeholder=".txt,.jpg,*.mp*" style="width:200px">
      <label class="reverse-cb"><input type="checkbox" data-reverse="f_extEq">取反</label>
    </div>

    <!-- 后缀不等于 -->
    <div class="filter-row">
      <input type="checkbox" id="f_extNe" data-filter="extNe">
      <label for="f_extNe">后缀不等于</label>
      <input type="text" id="f_extNeVal" placeholder=".tmp,.log" style="width:200px">
      <label class="reverse-cb"><input type="checkbox" data-reverse="f_extNe">取反</label>
    </div>

    <!-- 修改日期 -->
    <div class="filter-row">
      <input type="checkbox" id="f_days" data-filter="days">
      <label for="f_days">修改日期在</label>
      <div class="input-group">
        <input type="number" id="f_daysVal" value="30" min="0">
        <span>天内</span>
      </div>
      <label class="reverse-cb"><input type="checkbox" data-reverse="f_days">取反</label>
    </div>

    <!-- 空文件夹 -->
    <div class="filter-row">
      <input type="checkbox" id="f_empty" data-filter="empty">
      <label for="f_empty">空文件夹</label>
      <label class="reverse-cb"><input type="checkbox" data-reverse="f_empty">取反</label>
    </div>
  </div>

  <!-- ===== Action Buttons ===== -->
  <div class="action-bar">
    <button class="btn-scan" id="btnScan" disabled>🔍 扫描</button>
    <button class="btn-danger" id="btnDelete" disabled>🗑 删除选中</button>
    <button class="btn-action" id="btnDisband" disabled>📦 解散文件夹</button>
    <button class="btn-action" id="btnExport" disabled>📄 导出列表</button>
    <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#666;cursor:pointer;margin-left:auto">
      <input type="checkbox" id="chkSelectAll" style="width:16px;height:16px;accent-color:#4a7cf7"> 全选
    </label>
  </div>

  <!-- ===== File Table ===== -->
  <div class="table-section">
    <div class="table-wrap">
      <table id="fileTable">
        <thead>
          <tr>
            <th style="width:40px"><input type="checkbox" id="thSelectAll" style="width:15px;height:15px;accent-color:#4a7cf7"></th>
            <th data-sort="name">文件名 <span class="sort-arrow"></span></th>
            <th data-sort="size">大小 <span class="sort-arrow"></span></th>
            <th data-sort="type">类型 <span class="sort-arrow"></span></th>
            <th data-sort="modified">修改时间 <span class="sort-arrow"></span></th>
            <th data-sort="path">路径 <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="fileBody">
          <tr><td colspan="6" class="empty-state">选择文件夹后点击"扫描"开始</td></tr>
        </tbody>
      </table>
    </div>
    <div class="totals-bar" id="totalsBar"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Confirm Modal -->
<div class="modal-mask" id="confirmModal">
  <div class="modal-box">
    <h4 id="confirmTitle">确认</h4>
    <p id="confirmMsg"></p>
    <div class="btns">
      <button class="btn-cancel" id="confirmCancel">取消</button>
      <button class="btn-confirm" id="confirmOk">确认</button>
    </div>
  </div>
</div>

<script>
// ===== Mock Data Generator =====
const MOCK_DIR = '/Users/alice/Downloads/MockScan';

function generateMockFiles() {
  const names = [
    '年度财务报表.xlsx', '项目方案v3.docx', '会议录音.m4a', 'UI设计稿.psd',
    '客户数据.csv', '培训视频.mp4', '产品原型.fig', '需求文档.doc',
    '服务器日志.log', '备份数据.zip', '演示文稿.pptx', '合同模板.pdf',
    '测试报告.md', '数据库导出.sql', '安装程序.exe', '配置文件.json',
    '数据看板.html', '错误日志.txt', '脚本文件.py', '图片资源.png',
    '压缩素材.rar', '视频片段.mov', '音频素材.wav', '字体文件.ttf',
    '开源代码.tar.gz', '部署脚本.sh', 'API文档.yaml', 'README.md',
    '缓存文件.tmp', '缩略图_001.jpg'
  ];
  const sizes = [
    256, 0.8, 12.5, 450, 5, 180, 320, 1.2,
    0.05, 500, 45, 8, 0.3, 22, 890, 0.01,
    0.15, 0.02, 0.4, 3.2, 1500, 67, 8.5, 0.003,
    800, 0.1, 0.02, 0.001, 2, 0.5
  ];
  const today = new Date();
  const files = names.map((name, i) => {
    const mod = new Date(today);
    mod.setDate(mod.getDate() - Math.floor(Math.random() * 180));
    return {
      name,
      size: sizes[i],
      modified: mod.toISOString().slice(0, 16).replace('T', ' '),
      path: MOCK_DIR + (Math.random() > 0.7 ? '/子文件夹/' + ['备份/', '临时/', '归档/'][Math.floor(Math.random()*3)] : ''),
    };
  });
  // Add a few "empty folder" entries
  files.push({ name: '[空] 旧项目备份', size: 0, modified: '2025-03-10 14:20', path: MOCK_DIR + '/旧项目备份/', empty: true });
  files.push({ name: '[空] 测试数据', size: 0, modified: '2025-11-05 09:00', path: MOCK_DIR + '/测试数据/', empty: true });
  return files;
}

let allFiles = [];
let filteredFiles = [];
let sortField = 'modified';
let sortAsc = false;

// ===== DOM =====
const dropZone = document.getElementById('dropZone');
const folderInput = document.getElementById('folderInput');
const folderPathEl = document.getElementById('folderPath');
const btnScan = document.getElementById('btnScan');
const btnDelete = document.getElementById('btnDelete');
const btnDisband = document.getElementById('btnDisband');
const btnExport = document.getElementById('btnExport');
const chkSelectAll = document.getElementById('chkSelectAll');
const thSelectAll = document.getElementById('thSelectAll');
const fileBody = document.getElementById('fileBody');
const totalsBar = document.getElementById('totalsBar');
const toastEl = document.getElementById('toast');
const confirmModal = document.getElementById('confirmModal');

let selectedPath = '';

// ===== Folder Selection =====
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const items = e.dataTransfer.items;
  if (items) {
    let count = 0;
    for (const item of items) {
      if (item.kind === 'file') count++;
      if (count > 0) break;
    }
    if (count > 0) {
      selectedPath = '[已拖入文件夹]';
      folderPathEl.textContent = selectedPath;
      folderPathEl.classList.add('show');
      btnScan.disabled = false;
      showToast('文件夹已就绪，点击扫描开始');
    }
  }
});
folderInput.addEventListener('change', () => {
  if (folderInput.files.length > 0) {
    selectedPath = folderInput.files[0].webkitRelativePath.split('/')[0];
    folderPathEl.textContent = selectedPath + '（' + folderInput.files.length + ' 个项目）';
    folderPathEl.classList.add('show');
    btnScan.disabled = false;
    showToast('文件夹已选择，点击扫描开始');
  }
});

// ===== Filter Change =====
document.querySelectorAll('[data-filter]').forEach(cb => {
  cb.addEventListener('change', applyFilter);
});
document.querySelectorAll('input[type="number"], input[type="text"]').forEach(inp => {
  inp.addEventListener('input', applyFilter);
});
document.querySelectorAll('[data-reverse]').forEach(cb => {
  cb.addEventListener('change', applyFilter);
});

function applyFilter() {
  if (!allFiles.length) return;
  filteredFiles = allFiles.filter(f => {
    // 大小 >
    let pass = true;
    const c1 = document.getElementById('f_sizeGt').checked;
    if (c1) {
      const v = parseFloat(document.getElementById('f_sizeGtVal').value) || 0;
      pass = f.size > v * 1024 * 1024;
    }
    if (document.querySelector('[data-reverse=f_sizeGt]').checked) pass = !pass;
    if (!pass) return false;

    // 大小 <
    pass = true;
    const c2 = document.getElementById('f_sizeLt').checked;
    if (c2) {
      const v = parseFloat(document.getElementById('f_sizeLtVal').value) || 0;
      pass = f.size < v * 1024 * 1024;
    }
    if (document.querySelector('[data-reverse=f_sizeLt]').checked) pass = !pass;
    if (!pass) return false;

    // 后缀 =
    pass = true;
    const c3 = document.getElementById('f_extEq').checked;
    if (c3) {
      const raw = document.getElementById('f_extEqVal').value.trim();
      if (raw) {
        const exts = raw.split(',').map(s => s.trim().toLowerCase());
        const fn = f.name.toLowerCase();
        pass = exts.some(ext => {
          if (ext.includes('*')) {
            const re = new RegExp('^' + ext.replace(/[.+?^${}()|[\]\\]/g,'\\$&').replace(/\*/g, '.*') + '$');
            return re.test(fn);
          }
          return fn.endsWith(ext);
        });
      }
    }
    if (document.querySelector('[data-reverse=f_extEq]').checked) pass = !pass;
    if (!pass) return false;

    // 后缀 !=
    pass = true;
    const c4 = document.getElementById('f_extNe').checked;
    if (c4) {
      const raw = document.getElementById('f_extNeVal').value.trim();
      if (raw) {
        const exts = raw.split(',').map(s => s.trim().toLowerCase());
        const fn = f.name.toLowerCase();
        pass = !exts.some(ext => fn.endsWith(ext));
      }
    }
    if (document.querySelector('[data-reverse=f_extNe]').checked) pass = !pass;
    if (!pass) return false;

    // 修改日期
    pass = true;
    const c5 = document.getElementById('f_days').checked;
    if (c5) {
      const days = parseInt(document.getElementById('f_daysVal').value) || 0;
      if (days > 0) {
        const mod = new Date(f.modified.replace(' ', 'T'));
        const diff = (Date.now() - mod.getTime()) / 86400000;
        pass = diff <= days;
      } else {
        pass = false;
      }
    }
    if (document.querySelector('[data-reverse=f_days]').checked) pass = !pass;
    if (!pass) return false;

    // 空文件夹
    pass = true;
    const c6 = document.getElementById('f_empty').checked;
    if (c6) pass = f.empty === true;
    if (document.querySelector('[data-reverse=f_empty]').checked) pass = !pass;
    if (!pass) return false;

    return true;
  });
  sortAndRender();
}

// ===== Scan =====
btnScan.addEventListener('click', () => {
  allFiles = generateMockFiles();
  filteredFiles = allFiles.slice();
  // Reset selections
  fileBody.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  chkSelectAll.checked = false;
  thSelectAll.checked = false;
  sortAndRender();
  showToast('扫描完成，共 ' + allFiles.length + ' 个项目');
});

// ===== Sort =====
document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const f = th.dataset.sort;
    if (sortField === f) { sortAsc = !sortAsc; }
    else { sortField = f; sortAsc = true; }
    document.querySelectorAll('.sort-arrow').forEach(s => s.textContent = '');
    th.querySelector('.sort-arrow').textContent = sortAsc ? '↑' : '↓';
    sortAndRender();
  });
});

function sortAndRender() {
  const sorted = filteredFiles.slice().sort((a, b) => {
    let va, vb;
    switch (sortField) {
      case 'name': va = a.name; vb = b.name; break;
      case 'size': va = a.size; vb = b.size; break;
      case 'type': va = getFileType(a.name); vb = getFileType(b.name); break;
      case 'modified': va = a.modified; vb = b.modified; break;
      case 'path': va = a.path; vb = b.path; break;
      default: va = a.modified; vb = b.modified;
    }
    if (typeof va === 'number') return sortAsc ? va - vb : vb - va;
    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });

  fileBody.innerHTML = '';
  sorted.forEach(f => {
    const tr = document.createElement('tr');
    tr.dataset.path = f.path + f.name;
    if (f.empty) tr.style.opacity = '0.55';
    tr.innerHTML = `
      <td><input type="checkbox" class="row-cb" data-path="${f.path}${f.name}" style="width:15px;height:15px;accent-color:#4a7cf7"></td>
      <td class="file-name">${f.empty ? '📁' : '📄'} ${escHtml(f.name)}</td>
      <td class="file-size">${f.empty ? '—' : formatSize(f.size)}</td>
      <td class="file-type">${f.empty ? '空文件夹' : getFileType(f.name)}</td>
      <td class="file-date">${f.modified}</td>
      <td class="file-path" title="${escHtml(f.path)}">${f.path.replace(MOCK_DIR + '/','').replace(MOCK_DIR,'')}</td>
    `;
    fileBody.appendChild(tr);
  });

  // Select-all sync
  const rows = fileBody.querySelectorAll('tr');
  rows.forEach(tr => {
    tr.querySelector('.row-cb').addEventListener('change', syncSelectAll);
  });
  syncSelectAll();
  updateTotals();
  updateActions();
}

function syncSelectAll() {
  const checked = fileBody.querySelectorAll('.row-cb:checked').length;
  const total = fileBody.querySelectorAll('.row-cb').length;
  chkSelectAll.checked = checked === total && total > 0;
  thSelectAll.checked = chkSelectAll.checked;
}

function toggleSelectAll(checked) {
  fileBody.querySelectorAll('.row-cb').forEach(cb => cb.checked = checked);
  fileBody.querySelectorAll('tr').forEach(tr => tr.classList.toggle('selected', checked));
  updateActions();
}

chkSelectAll.addEventListener('change', () => toggleSelectAll(chkSelectAll.checked));
thSelectAll.addEventListener('change', () => toggleSelectAll(thSelectAll.checked));

// ===== Table row hover =====
fileBody.addEventListener('change', (e) => {
  if (e.target.classList.contains('row-cb')) {
    e.target.closest('tr').classList.toggle('selected', e.target.checked);
    syncSelectAll();
    updateActions();
  }
});

// ===== Actions =====
btnDelete.addEventListener('click', () => {
  const selected = getSelected();
  showConfirm('确认删除', `确定要删除选中的 ${selected.length} 个文件吗？此操作不可恢复。`, () => {
    showToast('已删除 ' + selected.length + ' 个文件（模拟）');
    selected.forEach(p => {
      const idx = allFiles.findIndex(f => f.path + f.name === p);
      if (idx > -1) allFiles.splice(idx, 1);
    });
    allFiles = allFiles.filter(f => !selected.includes(f.path + f.name));
    applyFilter();
    if (!allFiles.length) {
      fileBody.innerHTML = '<tr><td colspan="6" class="empty-state">无匹配文件</td></tr>';
    }
  });
});

btnDisband.addEventListener('click', () => {
  const subFiles = allFiles.filter(f => f.path.includes('子文件夹'));
  if (!subFiles.length) { showToast('没有找到子文件夹中的文件'); return; }
  showConfirm('解散文件夹', `将 ${subFiles.length} 个文件从子文件夹移至根目录，并删除空文件夹。`, () => {
    subFiles.forEach(f => { f.path = MOCK_DIR + '/'; });
    allFiles = allFiles.filter(f => !f.path.includes('子文件夹') || f.path.includes('子文件夹'));
    applyFilter();
    showToast('已解散文件夹，' + subFiles.length + ' 个文件已移至根目录');
  });
});

btnExport.addEventListener('click', () => {
  const rows = fileBody.querySelectorAll('.row-cb:checked');
  let csv = '\uFEFF文件名,大小,类型,修改时间,路径\n';
  rows.forEach(cb => {
    const tr = cb.closest('tr');
    const cells = tr.querySelectorAll('td');
    const name = cells[1].textContent.replace(/^[\s\S]\s*/, '');
    csv += `${name},${cells[2].textContent},${cells[3].textContent},${cells[4].textContent},${cells[5].textContent}\n`;
  });
  if (!rows.length && !csv.match(/\n$/)) {
    csv = '\uFEFF文件名,大小,类型,修改时间,路径\n';
    filteredFiles.forEach(f => {
      csv += `${f.name},${f.empty ? '0' : f.size + 'MB'},${f.empty ? '空文件夹' : getFileType(f.name)},${f.modified},${f.path.replace(MOCK_DIR + '/','')}\n`;
    });
  }
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'file_list.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('已导出 ' + (rows.length || filteredFiles.length) + ' 条记录');
});

function updateActions() {
  const sel = getSelected().length;
  btnDelete.disabled = sel === 0;
  btnDisband.disabled = sel === 0 && !allFiles.some(f => f.path.includes('子文件夹'));
  btnExport.disabled = allFiles.length === 0;
}

function getSelected() {
  return Array.from(fileBody.querySelectorAll('.row-cb:checked')).map(cb => cb.dataset.path);
}

// ===== Helpers =====
function formatSize(mb) {
  if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
  if (mb >= 1) return mb.toFixed(1) + ' MB';
  return (mb * 1024).toFixed(0) + ' KB';
}

function getFileType(name) {
  const ext = name.slice((name.lastIndexOf('.') - 1 >>> 0) + 2).toLowerCase();
  const map = {
    xlsx:'Excel',docx:'Word',m4a:'音频',psd:'Photoshop',csv:'CSV',mp4:'视频',
    fig:'Figma',doc:'Word',log:'日志',zip:'压缩包',pptx:'PPT',pdf:'PDF',
    md:'Markdown',sql:'数据库',exe:'程序',json:'JSON',html:'网页',txt:'文本',
    py:'Python',png:'图片',rar:'压缩包',mov:'视频',wav:'音频',ttf:'字体',
    'tar.gz':'压缩包',sh:'Shell',yaml:'YAML',tmp:'临时文件',jpg:'JPEG'
  };
  return map[ext] || '文件';
}

function escHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function updateTotals() {
  const total = filteredFiles.length;
  const sel = getSelected().length;
  const sizeStr = filteredFiles.reduce((s, f) => s + (f.empty ? 0 : f.size), 0);
  totalsBar.textContent = `共 ${total} 项，已选 ${sel} 项，总大小 ${formatSize(sizeStr)}`;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function showConfirm(title, msg, onOk) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  confirmModal.classList.add('show');
  const ok = document.getElementById('confirmOk');
  const cancel = document.getElementById('confirmCancel');
  ok.onclick = () => { confirmModal.classList.remove('show'); onOk(); };
  cancel.onclick = () => confirmModal.classList.remove('show');
  confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) confirmModal.classList.remove('show'); }, { once: true });
}
</script>
