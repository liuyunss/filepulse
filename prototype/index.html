<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件脉搏 FilePulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部：文件夹选择 -->
    <div id="folder-select">
        <div id="drop-zone">拖入文件夹到这里，或点击选择</div>
        <input type="file" id="folder-input" webkitdirectory>
        <div id="current-path">当前路径：未选择</div>
    </div>
    
    <!-- 中间：筛选条件 -->
    <div id="filters">
        <label>
            <input type="checkbox" id="size-filter">
            <select id="size-op">
                <option value="gt">大于</option>
                <option value="lt">小于</option>
                <option value="eq">等于</option>
            </select>
            <input type="number" id="size-value" value="10">
            <select id="size-unit">
                <option value="MB">MB</option>
                <option value="KB">KB</option>
                <option value="GB">GB</option>
            </select>
            <input type="checkbox" id="size-negate"> 取反
        </label>
        
        <label>
            <input type="checkbox" id="ext-filter">
            后缀等于 <input type="text" id="ext-value" placeholder=".mp4,.avi">
            <input type="checkbox" id="ext-negate"> 取反
        </label>
        
        <label>
            <input type="checkbox" id="date-filter">
            修改日期在 <input type="number" id="date-value" value="7"> 天内
            <input type="checkbox" id="date-negate"> 取反
        </label>
        
        <label>
            <input type="checkbox" id="empty-filter">
            空文件夹
            <input type="checkbox" id="empty-negate"> 取反
        </label>
    </div>
    
    <!-- 底部：文件列表 -->
    <div id="file-list">
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="select-all"></th>
                    <th>文件名</th>
                    <th>大小</th>
                    <th>类型</th>
                    <th>修改时间</th>
                    <th>路径</th>
                </tr>
            </thead>
            <tbody id="file-tbody"></tbody>
        </table>
    </div>
    
    <!-- 操作按钮 -->
    <div id="actions">
        <button id="btn-scan">扫描</button>
        <button id="btn-preview">预览</button>
        <button id="btn-delete">删除</button>
        <button id="btn-empty-cleanup">空文件清理</button>
        <button id="btn-advanced">高级 ▼</button>
    </div>
    
    <!-- 高级面板 -->
    <div id="advanced-panel" style="display:none">
        <div id="empty-cleanup-section" style="display:none; padding: 15px; background: #fff8f0; border: 1px solid #ffcc80; border-radius: 5px; margin: 10px 0;">
            <div style="margin-bottom: 10px;">
                <strong>空文件清理</strong> - 找出0KB文件并清理
            </div>
            <div style="margin-bottom: 10px;">
                <label>指定后缀（逗号分隔）：</label>
                <input type="text" id="empty-ext-value" placeholder=".txt,.log,.tmp" value=".txt,.log,.tmp">
            </div>
            <div style="margin-bottom: 10px;">
                <button id="btn-scan-empty">扫描空文件</button>
                <button id="btn-delete-empty" disabled>删除选中</button>
                <button id="btn-close-empty-cleanup">关闭</button>
            </div>
            <div id="empty-cleanup-preview" style="display:none;">
                <div style="margin-bottom: 5px; color: #666;" id="empty-cleanup-count"></div>
                <div id="empty-cleanup-list" style="max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>
        
        <div id="dissolve-section">
            解散文件夹 - 保留 
            <select id="keep-levels">
                <option value="0">0</option>
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select> 级
            <button id="btn-preview-dissolve">预览解散</button>
            <button id="btn-execute-dissolve">执行解散</button>
        </div>
        
        <div id="dissolve-preview" style="display:none"></div>
        
        <div id="rules-section">
            <div>已保存的规则：</div>
            <div id="rules-list"></div>
            <button id="btn-execute-rule">执行选中规则</button>
            <button id="btn-save-rule">保存当前条件为规则</button>
            <button id="btn-delete-rule">删除规则</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
