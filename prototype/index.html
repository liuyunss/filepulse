<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilePulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <!-- ── 顶栏 ── -->
    <header>
        <h1>FilePulse <span class="subtitle">文件脉搏</span></h1>
        <div id="drop-zone">
            <div class="drop-icon">📁</div>
            <div>拖入文件夹 或 <button id="btn-browse" class="link-btn">点击浏览</button></div>
        </div>
        <div class="header-meta">
            <span id="current-path">演示数据 — C:\Users\Docs\Project</span>
            <span id="file-count">12 个文件</span>
        </div>
        <input type="file" id="folder-input" webkitdirectory hidden>
    </header>

    <div id="body-wrap">
        <!-- ── 左侧栏 ── -->
        <aside id="sidebar">
            <div class="side-section">
                <h3>🔍 筛选条件</h3>
                <div id="filters">
                    <label class="filter-row">
                        <input type="checkbox" id="name-filter"> 名称
                        <select id="name-op" style="width:46px"><option value="contains">包含</option><option value="prefix">前缀</option><option value="suffix">后缀</option></select>
                        <input type="text" id="name-value" placeholder="关键词" style="width:56px">
                        <label class="negate"><input type="checkbox" id="name-negate"> 取反</label>
                    </label>
                    <label class="filter-row">
                        <input type="checkbox" id="ext-filter"> 后缀
                        <input type="text" id="ext-value" placeholder=".mp4" style="width:104px">
                        <label class="negate"><input type="checkbox" id="ext-negate"> 取反</label>
                    </label>
                    <label class="filter-row">
                        <input type="checkbox" id="size-filter"> 大小
                        <select id="size-op" style="width:36px"><option value="gt">&gt;</option><option value="lt">&lt;</option><option value="eq">=</option></select>
                        <input type="number" id="size-value" value="10" style="width:40px">
                        <select id="size-unit" style="width:40px"><option value="MB">MB</option><option value="KB">KB</option><option value="GB">GB</option></select>
                        <label class="negate"><input type="checkbox" id="size-negate"> 取反</label>
                    </label>
                    <label class="filter-row">
                        <input type="checkbox" id="date-filter"> 日期
                        <select id="date-op" style="width:46px"><option value="lt">最近</option><option value="gt">早于</option></select>
                        <input type="number" id="date-value" value="7" style="width:32px">
                        <select id="date-unit" style="width:36px"><option value="hour">时</option><option value="day" selected>天</option><option value="month">月</option></select>
                        <label class="negate"><input type="checkbox" id="date-negate"> 取反</label>
                    </label>
                    <label class="filter-row">
                        <input type="checkbox" id="empty-filter"> 空文件夹
                        <label class="negate"><input type="checkbox" id="empty-negate"> 取反</label>
                    </label>
                </div>
            </div>

            <div class="side-section">
                <h3>💾 保存配置</h3>
                <div class="save-row">
                    <input type="text" id="rule-name" placeholder="输入配置名称">
                    <button id="btn-save-rule">保存</button>
                </div>
                <div id="rules-list"></div>
            </div>

            <div class="side-section">
                <h3>🛠 工具</h3>
                <div style="display:flex;align-items:center;gap:4px">
                    <button id="btn-dissolve" style="flex:1">解散(保留 <input type="number" id="keep-levels" value="1" min="0" max="5" style="width:36px"> 级)</button>
                    <span style="padding:3px 8px;font-size:13px;color:var(--text3);cursor:help;border:1px solid var(--border);border-radius:3px;background:#F7F8FA"
                        title="保留0级：a/b/1.txt  →  根目录/1.txt（b文件夹消失）
保留1级：a/b/c/1.txt  →  a/1.txt（b、c文件夹消失）
保留2级：a/b/c/1.txt  →  a/b/1.txt（仅c文件夹消失）">?</span>
                </div>
            </div>
        </aside>

        <!-- ── 右侧主内容 ── -->
        <main id="main-content">
            <div id="table-wrap">
                <table id="file-table">
                    <thead><tr>
                        <th class="col-chk"><input type="checkbox" id="select-all" title="全选"></th>
                        <th class="col-path sortable" data-sort="path">
                            <span class="th-label">路径</span>
                            <button class="sort-btn" data-sort="path">▲</button>
                        </th>
                        <th class="col-size sortable" data-sort="size">
                            <span class="th-label">大小</span>
                            <button class="sort-btn" data-sort="size">▲</button>
                        </th>
                        <th class="col-type sortable" data-sort="extension">
                            <span class="th-label">类型</span>
                            <button class="sort-btn" data-sort="extension">▲</button>
                        </th>
                        <th class="col-date sortable" data-sort="modified">
                            <span class="th-label">修改时间</span>
                            <button class="sort-btn" data-sort="modified">▲</button>
                        </th>
                        <th class="col-action">操作</th>
                    </tr></thead>
                    <tbody id="file-tbody"></tbody>
                </table>
            </div>

            <div class="action-bar">
                <button id="btn-preview">▶ 预览匹配</button>
                <button id="btn-delete" class="danger-btn">✕ 删除选中</button>
                <span id="status-text">就绪</span>
            </div>
        </main>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
